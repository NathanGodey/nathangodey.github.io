    }

- id: co-lmlm
  title: "Co-LMLM: Continuous-Query Limited Memory Language Models"
  authors: ["Yair Feldman", "Linxi Zhao", "Nathan Godey", "Dongyoung Go", "Yilun Hua", "Kilian Q. Weinberger", "Jennifer J. Sun", "Yoav Artzi"]
  venue: "Preprint"
  year: 2026
  date: 2026-07-08
  image: /img/thumbnails/colmlm_thumb.jpeg
  links:
    arxiv: https://arxiv.org/abs/2607.07707
    project: https://lil-lab.github.io/co-lmlm-web/
  tldr: "An LLM pretrained to retrieve knowledge from an external KB with continuous vector queries and copy it, rather than memorize it, improving perplexity and factual precision."
  abstract: "Externalizing knowledge in LLM pre-training is a promising avenue to achieve higher performance at smaller scales, control knowledge use, and overall increase model transparency. We propose continuous-query limited memory language models (Co-LMLM), an LLM that interleaves flexible vector retrieval queries with next-token predictions, and is pre-trained to copy knowledge returned from the KB, rather than memorize it. Co-LMLM is pre-trained with a scalable approach that jointly trains a knowledge-externalizing LLM, induces its knowledge base, and learns an expressive continuous retrieval mechanism. Across pre-training at multiple model scales, Co-LMLM outperforms prior knowledge-externalizing and vanilla LLMs in both perplexity and factual precision. At 360M scale, this includes lower perplexity than models pre-trained on 40× more data, and SimpleQA-verified performance that is in line with gpt-4o-mini and higher than Claude Sonnet 4.5."
