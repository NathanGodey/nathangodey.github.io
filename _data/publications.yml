          primaryClass={cs.CL}
    }

- id: looped-shared-memory
  title: "The Surprising Effectiveness of Shared Memory in Looped Transformers"
  authors: ["Giovanni Monea", "Keshav Ramji", "Yousef El-Kurdi", "Luis A. Lastras", "Yoav Artzi", "Nathan Godey†", "Ramón Fernandez Astudillo†"]
  note: "† Equal advising"
  venue: "Preprint"
  year: 2026
  date: 2026-10-01
  image: /img/thumbnails/lpt_thumb.jpeg
  links:
    arxiv: https://arxiv.org/abs/2610.02383
  tldr: "Looped Transformers whose later recursions read the first recursion's KV cache improve perplexity while using 76-79% less context memory."
  abstract: "Looped Transformers apply the same layers several times per token, adding compute to improve quality without more parameters. Each recursion, however, writes its own key-value cache, so memory still grows with compute. Inference-time techniques can shrink this cache at a cost in quality. We pretrain looped language models to share memory: only the first recursion writes a cache, and later recursions read it while keeping a short window of their own. Surprisingly, we find that sharing memory does not cost quality and instead improves it. At 150M-1B parameters, our Looped Prediction Transformer (LPT) and its hybrid variant set a new quality-memory frontier for looped models: with five recursions, the hybrid lowers validation perplexity on FineWeb-Edu by 1.12-1.82 relative to a same-size standard Transformer while using 76-79% less context memory. Through an extensive analysis, we investigate why memory sharing helps. Shared and local memory develop different representations, and later recursions attend mostly to the shared memory, which also acts as a gradient highway to the first recursion."
  old_url: /posts/looped-shared-memory/
  bibtex: |-
    @misc{monea2026sharedmemory,
          title={The Surprising Effectiveness of Shared Memory in Looped Transformers},
          author={Giovanni Monea and Keshav Ramji and Yousef El-Kurdi and Luis A. Lastras and Yoav Artzi and Nathan Godey and Ramón Fernandez Astudillo},
          year={2026},
          eprint={2610.02383},
          archivePrefix={arXiv},
          primaryClass={cs.LG}
    }

- id: almost-free-sps
  title: "Almost Free State Prediction Separation"
  authors: ["John Langford*", "Nathan Godey*", "Giovanni Monea", "Yoav Artzi", "Harry Dong", "Ying Fan", "Gustavo de Rosa", "Zheng Zhan"]
  note: "* Equal contribution"
  venue: "Preprint"
  year: 2026
  date: 2026-09-03
  image: /img/thumbnails/freesps_thumb.jpeg
  links:
    arxiv: https://arxiv.org/abs/2609.03807
  tldr: "A free pause token that writes no keys or values brings most of the gains of state-prediction separation at no inference cost and as little as 1.09× training overhead."
  abstract: "State-prediction separation (SPS) relieves a language model's hidden state of two competing burdens (*summarizing* the context and *predicting* the next token) by splitting the forward pass into a state stream and a prediction stream. The separation works, but it is expensive: the prediction stream is a second pass over the whole backbone, costing ~1.9× the pretraining FLOPs, and even more in terms of wall-clock time when using a flexible attention mask. This paper makes state-prediction separation almost free. We take the separation to its limit with a *free pause token*: a prediction stream that writes no keys or values at all and so rides the sequence's existing positions. It improves next-token prediction of a standard Transformer by 2-3 centinats in practice on a 1B parameter model, and because it adds no position it costs nothing at inference: no added context length, no KV cache, no decode steps, and essentially no latency, with the growth in inference flops typically irrelevant as it is not the active bottleneck on throughput. The cost is therefore entirely in training where we use four mechanisms to drive it down: a two-pass split that keeps FlashAttention kernels viable, the w=0 prediction window, a shared gated FFN that evaluates one FFN per position rather than one per stream, and phasing the separation onto the tail of the run. Together these bring the overhead versus an optimized pretraining pipeline to 1.33× wall-clock while recovering ~94% of the gain compared to SPS, and to as low as 1.09× along a graceful quality/compute tradeoff. Furthermore, the FFN optimization reduces the raw flops required at inference time. The result is an isoflop, isoparameter, and isotoken improvement over standard next token trained transformers."
  old_url: /posts/almost-free-sps/
  bibtex: |-
    @misc{langford2026almostfree,
          title={Almost Free State Prediction Separation},
          author={John Langford and Nathan Godey and Giovanni Monea and Yoav Artzi and Harry Dong and Ying Fan and Gustavo de Rosa and Zheng Zhan},
          year={2026},
          eprint={2609.03807},
          archivePrefix={arXiv},
          primaryClass={cs.LG}
    }

- id: matryoshka-suites
  title: "Matryoshka Language Model Suites"
  authors: ["Nathan Godey", "Yoav Artzi"]
  venue: "Preprint"
  year: 2026
  date: 2026-08-10
  featured: 3
  image: /img/thumbnails/matryoshka_thumb.jpeg
  links:
    arxiv: https://arxiv.org/abs/2608.09703
  tldr: "Nesting a whole suite of LMs (500M, 1.5B, 3B) into a single architecture trained end-to-end saves 36% training compute and speeds up speculative decoding by 14-26%."
  abstract: "Training a language model suite classically requires training each model separately and serving them independently. We improve both training and inference efficiency by stacking sub-models of increasing size into a single nested architecture trained end-to-end. This Matryoshka training framework reduces the total parameter count of the suite, enables low-cost distillation from the largest to all smaller sub-models at every training step, and is well-suited for speculative decoding as the draft model is contained within the verifier. We validate our approach by training a Matryoshka suite comprising 500M, 1.5B, and 3B sub-models. Our suite is on par with independently trained baselines on benchmark performance and validation and out-of-domain perplexities, while using 36% less training compute and improving the throughput of speculative decoding by 14-26%. We also ablate key architectural choices, offering guidance for building strong Matryoshka LM suites."
  old_url: /posts/matryoshka-suites/
  bibtex: |-
    @misc{godey2026matryoshka,
          title={Matryoshka Language Model Suites},
          author={Nathan Godey and Yoav Artzi},
