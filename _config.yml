# Site settings. Content lives in _data/ (publications, news, people) and _posts/ (writing).
# See CLAUDE.md before editing.

title: Nathan Godey
description: Postdoctoral researcher at Cornell Tech working on language models.
url: https://nathangodey.github.io
baseurl: ""
lang: en
timezone: America/New_York

author:
  name: Nathan Godey
  email: godeynathan@gmail.com

google_analytics: G-HD7R5X335C

# Top navigation, in order. `url` may be external.
nav:
  - title: Publications
    url: /publications/
  - title: Writing
    url: /logbook/
  - title: Teaching
    url: https://github.com/NathanGodey/AdvancedNLP
  - title: CV
    url: /cv/

links:
  - title: Email
    url: mailto:godeynathan@gmail.com
  - title: Google Scholar
    url: https://scholar.google.com/citations?user=YIbsNP8AAAAJ
  - title: GitHub
    url: https://github.com/NathanGodey
  - title: Twitter
    url: https://twitter.com/nthngdy
  - title: LinkedIn
    url: https://www.linkedin.com/in/nathan-g-114298175/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: null

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: ""
    values:
      layout: page

sass:
  style: compressed

exclude:
  - CLAUDE.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - tools
  - vendor
  - _tabs
  - "*.gem"
